# Development Docker Compose for Kenchi
#
# Uses .env in the repo root for secrets (dev values).
# For production, use docker-compose.prod.yml which reads
# from /etc/kenchi/.env.production on the VPS.
#
# Usage: docker compose up -d

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: kenchi-postgres
    environment:
      - POSTGRES_USER=kenchi
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-kenchi_dev_password}
      - POSTGRES_DB=kenchi
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kenchi -d kenchi"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: kenchi-redis
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    # Port not exposed to host - services connect via internal docker network
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    environment:
      - SERVICE=api
      - NODE_ENV=production
      - NODE_OPTIONS=--max-old-space-size=256
      - PORT=3000
      - DATABASE_URL=postgres://kenchi:${POSTGRES_PASSWORD:-kenchi_dev_password}@postgres:5432/kenchi
      - REDIS_URL=redis://redis:6379
      - FRONTEND_URL=http://localhost:3003
      - OAUTH_CALLBACK_BASE_URL=http://localhost:3003
    env_file:
      - .env
    ports:
      - "3000:3000"
    dns:
      - 8.8.8.8
      - 8.8.4.4
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/health', (r) => {process.exit(r.statusCode === 200 ? 0 : 1)})"]
      interval: 30s
      timeout: 3s
      retries: 3
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  slack-bot:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    environment:
      - SERVICE=slack-bot
      - NODE_ENV=production
      - NODE_OPTIONS=--max-old-space-size=256
      - PORT=3001
      - MULTI_TENANT_MODE=true
      - DATABASE_URL=postgres://kenchi:${POSTGRES_PASSWORD:-kenchi_dev_password}@postgres:5432/kenchi
      - REDIS_URL=redis://redis:6379
    env_file:
      - .env
    ports:
      - "3001:3001"
    dns:
      - 8.8.8.8
      - 8.8.4.4
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3001/health', (r) => {process.exit(r.statusCode === 200 ? 0 : 1)})"]
      interval: 30s
      timeout: 3s
      retries: 3
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  github-app:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    environment:
      - SERVICE=github-app
      - NODE_ENV=production
      - NODE_OPTIONS=--max-old-space-size=256
      - PORT=3002
      - MULTI_TENANT_MODE=true
      - DATABASE_URL=postgres://kenchi:${POSTGRES_PASSWORD:-kenchi_dev_password}@postgres:5432/kenchi
      - REDIS_URL=redis://redis:6379
      - API_URL=http://api:3000
      - SLACK_BOT_URL=http://slack-bot:3001
      - GITHUB_APP_URL=${GITHUB_APP_URL:-}
    env_file:
      - .env
    ports:
      - "3002:3002"
    dns:
      - 8.8.8.8
      - 8.8.4.4
      - 1.1.1.1
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3002/health', (r) => {process.exit(r.statusCode === 200 ? 0 : 1)})"]
      interval: 30s
      timeout: 3s
      retries: 3
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  incident-triage:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    environment:
      - SERVICE=incident-triage
      - NODE_ENV=production
      - NODE_OPTIONS=--max-old-space-size=256
      - PORT=3004
      - DATABASE_URL=postgres://kenchi:${POSTGRES_PASSWORD:-kenchi_dev_password}@postgres:5432/kenchi
      - REDIS_URL=redis://redis:6379
    env_file:
      - .env
    ports:
      - "3004:3004"
    dns:
      - 8.8.8.8
      - 8.8.4.4
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3004/health', (r) => {process.exit(r.statusCode === 200 ? 0 : 1)})"]
      interval: 30s
      timeout: 3s
      retries: 3
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build:
      context: ./services/frontend
      dockerfile: Dockerfile
      args:
        VITE_PUBLIC_URL: ${VITE_PUBLIC_URL:-}
    container_name: kenchi-frontend
    ports:
      - "3003:80"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v2.51.0
    container_name: kenchi-prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=15d"
      - "--web.enable-lifecycle"
    volumes:
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./infra/prometheus/recording-rules.yml:/etc/prometheus/recording-rules.yml:ro
      - ./infra/prometheus/alerts:/etc/prometheus/alerts:ro
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:9090/-/healthy"]
      interval: 15s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  alertmanager:
    image: prom/alertmanager:v0.27.0
    container_name: kenchi-alertmanager
    command:
      - "--config.file=/etc/alertmanager/alertmanager.yml"
      - "--storage.path=/alertmanager"
    volumes:
      - ./infra/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager_data:/alertmanager
    ports:
      - "9093:9093"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:9093/-/healthy"]
      interval: 15s
      timeout: 5s
      retries: 3
    restart: unless-stopped
    depends_on:
      prometheus:
        condition: service_healthy

  grafana:
    image: grafana/grafana:10.4.0
    container_name: kenchi-grafana
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-kenchi_dev}
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_SERVER_ROOT_URL=http://localhost:3005
    volumes:
      - ./infra/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infra/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    ports:
      - "3005:3000"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 3
    restart: unless-stopped
    depends_on:
      prometheus:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
  prometheus_data:
  alertmanager_data:
  grafana_data:

