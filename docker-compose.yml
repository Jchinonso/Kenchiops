services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    environment:
      - SERVICE=api
      - NODE_ENV=production
      - PORT=3000
    env_file:
      - .env
    ports:
      - "3000:3000"
    dns:
      - 8.8.8.8
      - 8.8.4.4
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/health', (r) => {process.exit(r.statusCode === 200 ? 0 : 1)})"]
      interval: 30s
      timeout: 3s
      retries: 3
    restart: unless-stopped

  slack-bot:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    environment:
      - SERVICE=slack-bot
      - NODE_ENV=production
      - PORT=3001
    env_file:
      - .env
    ports:
      - "3001:3001"
    dns:
      - 8.8.8.8
      - 8.8.4.4
    restart: unless-stopped

  github-app:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    environment:
      - SERVICE=github-app
      - NODE_ENV=production
      - PORT=3002
    env_file:
      - .env
    ports:
      - "3002:3002"
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3002/health', (r) => {process.exit(r.statusCode === 200 ? 0 : 1)})"]
      interval: 30s
      timeout: 3s
      retries: 3
    restart: unless-stopped

  n8n:
    image: n8nio/n8n:latest
    container_name: kenchi-n8n
    environment:
      - N8N_BASIC_AUTH_ACTIVE=true
      - N8N_BASIC_AUTH_USER=admin
      - N8N_BASIC_AUTH_PASSWORD=admin123
      - N8N_HOST=localhost
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
      - WEBHOOK_URL=http://localhost:5678/
      - GENERIC_TIMEZONE=UTC
      - NODE_ENV=production
    ports:
      - "5678:5678"
    volumes:
      - n8n_data:/home/node/.n8n
      - ./n8n/workflows:/data/workflows:ro
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:5678/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    restart: unless-stopped
    depends_on:
      - api
      - slack-bot

volumes:
  n8n_data:

