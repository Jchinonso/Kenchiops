services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: kenchi-postgres
    environment:
      - POSTGRES_USER=kenchi
      - POSTGRES_PASSWORD=kenchi_dev_password
      - POSTGRES_DB=kenchi
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kenchi -d kenchi"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: kenchi-redis
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    # Port not exposed to host - services connect via internal docker network
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    environment:
      - SERVICE=api
      - NODE_ENV=production
      - NODE_OPTIONS=--max-old-space-size=256
      - PORT=3000
      - DATABASE_URL=postgres://kenchi:kenchi_dev_password@postgres:5432/kenchi
      - REDIS_URL=redis://redis:6379
      - LOGSAGE_ROLLOUT_PERCENTAGE=100
    env_file:
      - .env
    ports:
      - "3000:3000"
    dns:
      - 8.8.8.8
      - 8.8.4.4
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/health', (r) => {process.exit(r.statusCode === 200 ? 0 : 1)})"]
      interval: 30s
      timeout: 3s
      retries: 3
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  slack-bot:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    environment:
      - SERVICE=slack-bot
      - NODE_ENV=production
      - NODE_OPTIONS=--max-old-space-size=256
      - PORT=3001
      - MULTI_TENANT_MODE=true
      - DATABASE_URL=postgres://kenchi:kenchi_dev_password@postgres:5432/kenchi
      - REDIS_URL=redis://redis:6379
    env_file:
      - .env
    ports:
      - "3001:3001"
    dns:
      - 8.8.8.8
      - 8.8.4.4
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3001/health', (r) => {process.exit(r.statusCode === 200 ? 0 : 1)})"]
      interval: 30s
      timeout: 3s
      retries: 3
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  github-app:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    environment:
      - SERVICE=github-app
      - NODE_ENV=production
      - NODE_OPTIONS=--max-old-space-size=256
      - PORT=3002
      - MULTI_TENANT_MODE=true
      - DATABASE_URL=postgres://kenchi:kenchi_dev_password@postgres:5432/kenchi
      - REDIS_URL=redis://redis:6379
      - API_URL=http://api:3000
      - SLACK_BOT_URL=http://slack-bot:3001
      - GITHUB_APP_URL=${GITHUB_APP_URL:-}
    env_file:
      - .env
    ports:
      - "3002:3002"
    dns:
      - 8.8.8.8
      - 8.8.4.4
      - 1.1.1.1
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3002/health', (r) => {process.exit(r.statusCode === 200 ? 0 : 1)})"]
      interval: 30s
      timeout: 3s
      retries: 3
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:

