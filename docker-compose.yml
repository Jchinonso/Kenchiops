version: '3.8'

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    environment:
      - SERVICE=api
      - NODE_ENV=production
      - PORT=3000
    env_file:
      - .env
    ports:
      - "3000:3000"
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/health', (r) => {process.exit(r.statusCode === 200 ? 0 : 1)})"]
      interval: 30s
      timeout: 3s
      retries: 3
    restart: unless-stopped

  slack-bot:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    environment:
      - SERVICE=slack-bot
      - NODE_ENV=production
      - PORT=3001
    env_file:
      - .env
    ports:
      - "3001:3001"
    restart: unless-stopped

  github-app:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    environment:
      - SERVICE=github-app
      - NODE_ENV=production
      - PORT=3002
    env_file:
      - .env
    ports:
      - "3002:3002"
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3002/health', (r) => {process.exit(r.statusCode === 200 ? 0 : 1)})"]
      interval: 30s
      timeout: 3s
      retries: 3
    restart: unless-stopped

