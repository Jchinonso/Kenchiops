server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript image/svg+xml;

    # Cache static assets
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Proxy API backend routes (uses variable to avoid startup failure when API is unavailable)
    # Auth routes: OAuth login/callback, token refresh, logout, /auth/me
    location /auth/ {
        resolver 127.0.0.11 valid=30s ipv6=off;
        set $api_upstream http://api:3000;
        proxy_pass $api_upstream$request_uri;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Incident triage routes: proxy to incident-triage service on port 3004
    location /api/v1/incidents {
        resolver 127.0.0.11 valid=30s ipv6=off;
        set $incident_upstream http://incident-triage:3004;
        proxy_pass $incident_upstream$request_uri;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/v1/triage {
        resolver 127.0.0.11 valid=30s ipv6=off;
        set $incident_upstream http://incident-triage:3004;
        proxy_pass $incident_upstream$request_uri;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # API routes: analyses, events, RAG, fine-tuning, risk rules
    location /api/ {
        resolver 127.0.0.11 valid=30s ipv6=off;
        set $api_upstream http://api:3000;
        proxy_pass $api_upstream$request_uri;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Integration OAuth routes: Vercel, Netlify connect/callback/disconnect
    location /integrations/ {
        resolver 127.0.0.11 valid=30s ipv6=off;
        set $api_upstream http://api:3000;
        proxy_pass $api_upstream$request_uri;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Monitoring webhook routes: proxy to incident-triage service on port 3004
    # Regex location takes precedence over the generic /webhooks/ prefix block below
    location ~ ^/webhooks/(pagerduty|vercel|netlify|datadog|grafana|prometheus)(/[^/]+)?$ {
        resolver 127.0.0.11 valid=30s ipv6=off;
        set $incident_upstream http://incident-triage:3004;
        proxy_pass $incident_upstream$request_uri;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Webhook routes: GitHub, Slack (and any other non-monitoring webhooks)
    location /webhooks/ {
        resolver 127.0.0.11 valid=30s ipv6=off;
        set $api_upstream http://api:3000;
        proxy_pass $api_upstream$request_uri;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Health check proxy
    location /health {
        resolver 127.0.0.11 valid=30s ipv6=off;
        set $api_upstream http://api:3000;
        proxy_pass $api_upstream$request_uri;
        proxy_set_header Host $host;
    }

    # SPA fallback - serve index.html for all other routes
    # no-cache ensures browser revalidates on every visit so new builds are picked up immediately
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
