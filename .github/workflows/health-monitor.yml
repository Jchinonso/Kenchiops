name: Health Monitor

on:
  schedule:
    # Every 5 minutes
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  health-check:
    name: Production Health Check
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Check production health
        id: health
        run: |
          HTTP_STATUS=$(curl -sf -o /tmp/health.json -w "%{http_code}" \
            --connect-timeout 10 --max-time 15 \
            https://kenchiops.app/health 2>/dev/null || echo "000")

          echo "status=$HTTP_STATUS" >> $GITHUB_OUTPUT

          if [ "$HTTP_STATUS" = "200" ]; then
            echo "Production is healthy (HTTP $HTTP_STATUS)"
            cat /tmp/health.json | head -c 500
          else
            echo "Production health check failed (HTTP $HTTP_STATUS)"
            cat /tmp/health.json 2>/dev/null || echo "No response body"
          fi

      - name: Check readiness
        id: ready
        run: |
          HTTP_STATUS=$(curl -sf -o /tmp/ready.json -w "%{http_code}" \
            --connect-timeout 10 --max-time 15 \
            https://kenchiops.app/ready 2>/dev/null || echo "000")

          echo "status=$HTTP_STATUS" >> $GITHUB_OUTPUT

          if [ "$HTTP_STATUS" = "200" ]; then
            echo "Readiness check passed (HTTP $HTTP_STATUS)"
          else
            echo "Readiness check failed (HTTP $HTTP_STATUS)"
            cat /tmp/ready.json 2>/dev/null || echo "No response body"
          fi

      - name: Create incident issue
        if: steps.health.outputs.status != '200' || steps.ready.outputs.status != '200'
        uses: actions/github-script@v7
        with:
          script: |
            const healthStatus = '${{ steps.health.outputs.status }}';
            const readyStatus = '${{ steps.ready.outputs.status }}';
            const now = new Date().toISOString();

            const failedChecks = [];
            if (healthStatus !== '200') failedChecks.push(`/health (HTTP ${healthStatus})`);
            if (readyStatus !== '200') failedChecks.push(`/ready (HTTP ${readyStatus})`);
            const summary = failedChecks.join(', ');

            // Check if there's already an open incident issue
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              labels: 'incident',
              state: 'open',
            });

            if (issues.length > 0) {
              // Add a comment to existing incident
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issues[0].number,
                body: `Still failing at ${now}: ${summary}`,
              });
              console.log(`Updated existing incident #${issues[0].number}`);
            } else {
              // Create new incident issue
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: `Production failing: ${summary}`,
                body: [
                  `## Incident Detected`,
                  ``,
                  `- **Time:** ${now}`,
                  `- **Failed checks:** ${summary}`,
                  `- **URL:** https://kenchiops.app`,
                  ``,
                  `### Next Steps`,
                  `1. SSH to the VPS`,
                  `2. Check logs: \`docker compose -f docker-compose.prod.yml logs --tail=50\``,
                  `3. Check services: \`docker compose -f docker-compose.prod.yml ps\``,
                  `4. See \`docs/DEPLOYMENT.md\` for runbooks`,
                ].join('\n'),
                labels: ['incident'],
              });
              console.log('Created new incident issue');
            }
