name: Health Monitor

on:
  schedule:
    # Every 6 hours
    - cron: '0 */6 * * *'
  workflow_dispatch:

jobs:
  health-check:
    name: Production Health Check
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Check API health
        id: health
        run: |
          FINAL_STATUS="000"

          # Retry up to 3 times with 15s delay to handle transient network issues
          for attempt in 1 2 3; do
            HTTP_STATUS=$(curl -s -o /tmp/response.txt -w "%{http_code}" \
              --connect-timeout 10 --max-time 15 \
              https://kenchiops.app/health 2>/dev/null || echo "000")

            echo "Attempt $attempt: HTTP $HTTP_STATUS"

            if [ "$HTTP_STATUS" = "200" ]; then
              echo "Production is up (HTTP $HTTP_STATUS)"
              FINAL_STATUS="200"
              break
            else
              FINAL_STATUS="$HTTP_STATUS"
            fi

            if [ "$attempt" -lt 3 ]; then
              echo "Retrying in 15s..."
              sleep 15
            fi
          done

          echo "status=$FINAL_STATUS" >> $GITHUB_OUTPUT

      - name: Create incident issue
        if: steps.health.outputs.status != '200'
        uses: actions/github-script@v7
        with:
          script: |
            const status = '${{ steps.health.outputs.status }}';
            const now = new Date().toISOString();

            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              labels: 'incident',
              state: 'open',
            });

            if (issues.length > 0) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issues[0].number,
                body: `Still failing at ${now} (HTTP ${status})`,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: `Production down (HTTP ${status})`,
                body: [
                  `## Incident Detected`,
                  ``,
                  `- **Time:** ${now}`,
                  `- **HTTP status:** ${status}`,
                  `- **URL:** https://kenchiops.app`,
                  ``,
                  `### Next Steps`,
                  `1. SSH to VPS: \`ssh root@72.62.235.90\``,
                  `2. Check services: \`docker compose -f /opt/kenchi/docker-compose.prod.yml ps\``,
                  `3. Check logs: \`docker compose -f /opt/kenchi/docker-compose.prod.yml logs --tail=50\``,
                ].join('\n'),
                labels: ['incident'],
              });
            }
