name: Health Monitor

on:
  schedule:
    # Every 30 minutes
    - cron: '*/30 * * * *'
  workflow_dispatch:

jobs:
  health-check:
    name: Production Health Check
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Check API health
        id: health
        run: |
          # Check the API directly through the frontend proxy
          # /api/health requires auth, so we check / returns HTML (site is up)
          # and that the response contains expected content
          HTTP_STATUS=$(curl -s -o /tmp/response.txt -w "%{http_code}" \
            --connect-timeout 10 --max-time 15 \
            https://kenchiops.app/ 2>/dev/null || echo "000")

          echo "status=$HTTP_STATUS" >> $GITHUB_OUTPUT

          if [ "$HTTP_STATUS" = "200" ]; then
            # Verify it's actually our app, not a generic error page
            if grep -q "Kenchi" /tmp/response.txt 2>/dev/null; then
              echo "Production is up (HTTP $HTTP_STATUS, content verified)"
            else
              echo "status=503" >> $GITHUB_OUTPUT
              echo "Production returned 200 but unexpected content"
            fi
          else
            echo "Production health check failed (HTTP $HTTP_STATUS)"
          fi

      - name: Create incident issue
        if: steps.health.outputs.status != '200'
        uses: actions/github-script@v8
        with:
          script: |
            const status = '${{ steps.health.outputs.status }}';
            const now = new Date().toISOString();

            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              labels: 'incident',
              state: 'open',
            });

            if (issues.length > 0) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issues[0].number,
                body: `Still failing at ${now} (HTTP ${status})`,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: `Production down (HTTP ${status})`,
                body: [
                  `## Incident Detected`,
                  ``,
                  `- **Time:** ${now}`,
                  `- **HTTP status:** ${status}`,
                  `- **URL:** https://kenchiops.app`,
                  ``,
                  `### Next Steps`,
                  `1. SSH to VPS: \`ssh root@72.62.235.90\``,
                  `2. Check services: \`docker compose -f /opt/kenchi/docker-compose.prod.yml ps\``,
                  `3. Check logs: \`docker compose -f /opt/kenchi/docker-compose.prod.yml logs --tail=50\``,
                ].join('\n'),
                labels: ['incident'],
              });
            }
