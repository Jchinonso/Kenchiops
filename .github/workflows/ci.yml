name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '20'

jobs:
  lint:
    name: Lint & Format
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Check formatting
        run: npm run format:check

      - name: Run ESLint
        run: npm run lint

  type-check:
    name: Type Check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run type check
        run: npm run type-check

  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build shared package
        run: npm run build:shared

      - name: Run tests
        run: npm run test
        env:
          # Provide dummy values for required env vars during tests
          NODE_ENV: test
          OPENAI_API_KEY: test-key
          GITHUB_APP_ID: test-app-id
          GITHUB_APP_PRIVATE_KEY: test-private-key
          GITHUB_INSTALLATION_ID: "12345"
          GITHUB_WEBHOOK_SECRET: test-webhook-secret
          SLACK_BOT_TOKEN: test-token
          SLACK_SIGNING_SECRET: test-secret
          SLACK_APP_LEVEL_TOKEN: test-app-token
          DATABASE_URL: postgres://test:test@localhost:5432/test
          VECTOR_DB_URL: postgres://test:test@localhost:5432/test_vector

  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build all packages
        run: npm run build

      - name: Check build artifacts
        run: npm run check-build

      - name: Validate production dependencies
        run: npm run check:prod-deps

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: build-artifacts
          path: |
            packages/shared/dist
            services/*/dist
          retention-days: 7

  code-quality:
    name: Code Quality
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build shared package
        run: npm run build:shared

      - name: Check for code duplication
        run: npm run check:duplication

  validate:
    name: Validate Configuration
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Validate environment configuration
        run: npm run validate
        continue-on-error: true

  security:
    name: Security Audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run npm audit
        run: npm audit --audit-level=high
        continue-on-error: true

  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [lint, type-check, test, build]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          load: true
          tags: kenchi:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test — verify services start without import errors
        run: |
          for SERVICE in api slack-bot github-app incident-triage; do
            echo "Testing $SERVICE..."
            # Run the service for 3 seconds and check for module-not-found errors
            OUTPUT=$(docker run --rm -e SERVICE=$SERVICE -e NODE_ENV=test \
              -e OPENAI_API_KEY=test -e GITHUB_APP_ID=test \
              -e GITHUB_APP_PRIVATE_KEY=test -e GITHUB_INSTALLATION_ID=12345 \
              -e GITHUB_WEBHOOK_SECRET=test -e SLACK_BOT_TOKEN=test \
              -e SLACK_SIGNING_SECRET=test -e SLACK_APP_LEVEL_TOKEN=test \
              -e DATABASE_URL=postgres://test:test@localhost:5432/test \
              -e VECTOR_DB_URL=postgres://test:test@localhost:5432/test \
              kenchi:${{ github.sha }} \
              timeout 5 node services/$SERVICE/dist/index.js 2>&1 || true)

            if echo "$OUTPUT" | grep -q "ERR_MODULE_NOT_FOUND\|Cannot find module\|Cannot find package"; then
              echo "FAIL: $SERVICE has missing module imports:"
              echo "$OUTPUT" | grep -E "ERR_MODULE_NOT_FOUND|Cannot find module|Cannot find package"
              exit 1
            fi
            echo "  $SERVICE: OK (no missing modules)"
          done
          echo "All services passed smoke test!"

  # Summary job that other workflows can depend on
  ci-success:
    name: CI Success
    runs-on: ubuntu-latest
    needs: [lint, type-check, test, build, code-quality, validate, docker]
    if: always()
    steps:
      - name: Check all jobs passed
        run: |
          echo "Job results:"
          echo "  lint: ${{ needs.lint.result }}"
          echo "  type-check: ${{ needs.type-check.result }}"
          echo "  test: ${{ needs.test.result }}"
          echo "  build: ${{ needs.build.result }}"
          echo "  code-quality: ${{ needs.code-quality.result }}"
          echo "  docker: ${{ needs.docker.result }}"

          # Core jobs must pass
          if [[ "${{ needs.lint.result }}" != "success" ]] || \
             [[ "${{ needs.type-check.result }}" != "success" ]] || \
             [[ "${{ needs.test.result }}" != "success" ]] || \
             [[ "${{ needs.build.result }}" != "success" ]] || \
             [[ "${{ needs.code-quality.result }}" != "success" ]]; then
            echo "One or more core jobs failed"
            exit 1
          fi

          # Docker build: allow skipped (cancelled by concurrency) since deploy builds on VPS
          if [[ "${{ needs.docker.result }}" != "success" ]] && \
             [[ "${{ needs.docker.result }}" != "skipped" ]]; then
            echo "Docker build failed (not skipped)"
            exit 1
          fi

          echo "All CI checks passed!"

  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: [ci-success]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    timeout-minutes: 15
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure SSH
        env:
          SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H ${{ secrets.VPS_HOST }} >> ~/.ssh/known_hosts 2>/dev/null

      - name: Deploy to VPS
        run: |
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no \
            ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} \
            "cd /opt/kenchi && DEPLOY_SHA=${{ github.sha }} bash deploy/server-deploy.sh"

      - name: Deploy failed — notify
        if: failure()
        run: |
          echo "::error::Deploy failed for SHA ${{ github.sha }}. Auto-rollback may have been triggered on the VPS."
          echo "Check VPS logs: ssh root@${{ secrets.VPS_HOST }} 'cat /opt/kenchi/.deploy-history | tail -5'"

      - name: Cleanup SSH key
        if: always()
        run: rm -f ~/.ssh/deploy_key
