name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '20'

jobs:
  lint:
    name: Lint & Format
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Check formatting
        run: npm run format:check

      - name: Run ESLint
        run: npm run lint

  type-check:
    name: Type Check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run type check
        run: npm run type-check

  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build shared package
        run: npm run build:shared

      - name: Run tests
        run: npm run test
        env:
          # Provide dummy values for required env vars during tests
          NODE_ENV: test
          OPENAI_API_KEY: test-key
          GITHUB_APP_ID: test-app-id
          GITHUB_APP_PRIVATE_KEY: test-private-key
          GITHUB_INSTALLATION_ID: "12345"
          GITHUB_WEBHOOK_SECRET: test-webhook-secret
          SLACK_BOT_TOKEN: test-token
          SLACK_SIGNING_SECRET: test-secret
          SLACK_APP_LEVEL_TOKEN: test-app-token
          DATABASE_URL: postgres://test:test@localhost:5432/test
          VECTOR_DB_URL: postgres://test:test@localhost:5432/test_vector

  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build all packages
        run: npm run build

      - name: Check build artifacts
        run: npm run check-build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: build-artifacts
          path: |
            packages/shared/dist
            services/*/dist
          retention-days: 7

  code-quality:
    name: Code Quality
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build shared package
        run: npm run build:shared

      - name: Check for code duplication
        run: npm run check:duplication

  validate:
    name: Validate Configuration
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Validate environment configuration
        run: npm run validate
        continue-on-error: true

  security:
    name: Security Audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run npm audit
        run: npm audit --audit-level=high
        continue-on-error: true

  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [lint, type-check, test, build]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          tags: kenchi:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Summary job that other workflows can depend on
  ci-success:
    name: CI Success
    runs-on: ubuntu-latest
    needs: [lint, type-check, test, build, code-quality, validate, docker]
    if: always()
    steps:
      - name: Check all jobs passed
        run: |
          echo "Job results:"
          echo "  lint: ${{ needs.lint.result }}"
          echo "  type-check: ${{ needs.type-check.result }}"
          echo "  test: ${{ needs.test.result }}"
          echo "  build: ${{ needs.build.result }}"
          echo "  code-quality: ${{ needs.code-quality.result }}"
          echo "  docker: ${{ needs.docker.result }}"

          # Core jobs must pass
          if [[ "${{ needs.lint.result }}" != "success" ]] || \
             [[ "${{ needs.type-check.result }}" != "success" ]] || \
             [[ "${{ needs.test.result }}" != "success" ]] || \
             [[ "${{ needs.build.result }}" != "success" ]] || \
             [[ "${{ needs.code-quality.result }}" != "success" ]]; then
            echo "One or more core jobs failed"
            exit 1
          fi

          # Docker build: allow skipped (cancelled by concurrency) since deploy builds on VPS
          if [[ "${{ needs.docker.result }}" != "success" ]] && \
             [[ "${{ needs.docker.result }}" != "skipped" ]]; then
            echo "Docker build failed (not skipped)"
            exit 1
          fi

          echo "All CI checks passed!"

  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: [ci-success]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    timeout-minutes: 10
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H ${{ secrets.VPS_HOST }} >> ~/.ssh/known_hosts 2>/dev/null

      - name: Deploy to VPS
        run: |
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} << 'DEPLOY_SCRIPT'
            set -euo pipefail

            APP_DIR="/opt/kenchi"
            cd "$APP_DIR"

            echo "==> Pulling latest code..."
            git fetch origin main
            git reset --hard origin/main

            # Use prod compose if available, otherwise default
            COMPOSE_FILE="docker-compose.yml"
            if [ -f "docker-compose.prod.yml" ]; then
              COMPOSE_FILE="docker-compose.prod.yml"
            fi
            echo "==> Using compose file: $COMPOSE_FILE"

            echo "==> Building and deploying containers..."
            docker compose -f "$COMPOSE_FILE" up --build -d

            echo "==> Running database migrations..."
            for migration in database/init/*.sql; do
              echo "  Applying: $(basename "$migration")"
              docker compose -f "$COMPOSE_FILE" exec -T postgres \
                psql -U kenchi -d kenchi -f "/docker-entrypoint-initdb.d/$(basename "$migration")" 2>&1 | \
                grep -v "already exists" | grep -v "NOTICE" || true
            done

            echo "==> Waiting for services to start..."
            sleep 10

            echo "==> Health check..."
            for i in 1 2 3 4 5; do
              if curl -sf http://localhost:3000/health > /dev/null 2>&1; then
                echo "Health check passed!"
                docker compose -f "$COMPOSE_FILE" ps
                exit 0
              fi
              echo "Attempt $i/5 - waiting..."
              sleep 5
            done

            echo "Health check failed after 5 attempts"
            docker compose -f "$COMPOSE_FILE" logs --tail=50
            exit 1
          DEPLOY_SCRIPT

      - name: Cleanup SSH key
        if: always()
        run: rm -f ~/.ssh/deploy_key
